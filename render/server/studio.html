<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Why we do this</title>
<style>
  :root { --ground:#c8372d; --paper:#f4efe4; --ink:#161412; --line:#d9d2c3; --muted:#6b655c; --ok:#1f5d46; }
  * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 ui-sans-serif,system-ui,sans-serif }
  header { background:var(--ground); color:var(--paper); padding:20px 24px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap }
  header h1 { margin:0; font:700 15px/1 ui-monospace,Menlo,monospace; letter-spacing:.25em; text-transform:uppercase }
  header a { color:var(--paper); font-size:14px }
  main { max-width:980px; margin:0 auto; padding:24px; display:grid; gap:36px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; gap:12px }
  button { font:inherit; font-weight:600; padding:8px 13px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer }
  button.ghost { background:transparent; color:var(--ink) } button:disabled { opacity:.45; cursor:default }
  input, textarea { font:inherit; padding:9px 10px; border:1px solid var(--line); background:#fff; color:var(--ink); width:100% }
  textarea { resize:vertical; line-height:1.4 }
  .note { font-size:14px; color:var(--muted); margin:0 } .err { color:#a12018 } .okc { color:var(--ok) }
  #flash { position:sticky; top:0; z-index:2; padding:10px 24px; background:#fff; border-bottom:1px solid var(--line); font-size:14px; display:none }
  .card { background:#fff; border:1px solid var(--line); padding:16px; display:grid; gap:12px }
  .stack { display:grid; gap:14px }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap }
  .title { font-weight:700; font-size:18px } .pill { font:12px ui-monospace,Menlo,monospace; text-transform:uppercase; letter-spacing:.08em; padding:3px 8px; border:1px solid var(--line); color:var(--muted); white-space:nowrap }
  .beat { display:grid; grid-template-columns:86px 1fr; gap:10px; align-items:start }
  .beat .meta { font:12px/1.4 ui-monospace,Menlo,monospace; color:var(--muted); padding-top:9px }
  .beat .extra { grid-column:2; font-size:13px; color:var(--muted); margin-top:-4px }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .assets { display:flex; gap:6px; flex-wrap:wrap } .assets span { font:12px ui-monospace,Menlo,monospace; padding:3px 7px; border:1px solid var(--line) }
  .assets .approved { border-color:var(--ok); color:var(--ok) } .assets .error, .assets .missing, .assets .rejected { border-color:#a12018; color:#a12018 }
  details summary { cursor:pointer; font-size:14px; color:var(--muted) } details ul { margin:8px 0 0; padding-left:18px; font-size:14px } details p { font-size:14px; white-space:pre-wrap; margin:8px 0 0 }
  .q { display:grid; grid-template-columns:1fr auto; gap:6px 14px; padding:14px 0; border-top:1px solid var(--line) } .q:first-child { border-top:0 }
  .q .t { font-weight:700 } .q .a { font-size:14px } .q .s { font-size:13px; color:var(--muted) } .q .act { grid-row:1 / span 3; grid-column:2; display:flex; gap:6px; align-items:start }
  .q.queued .t::before { content:'✓ '; color:var(--ok) }
  form.add { display:grid; grid-template-columns:1fr auto; gap:8px }
  @media (max-width:640px) { .beat { grid-template-columns:1fr } .beat .extra { grid-column:1 } .q { grid-template-columns:1fr } .q .act { grid-row:auto; grid-column:1 } }
</style></head><body>
<header><h1>Why we do this · Studio</h1><a href="/library">Library of cut-outs and clips →</a></header>
<div id="flash"></div>
<main>
  <section><h2><span>Reels in progress</span><button id="draft">Write the next question</button></h2><div id="reels" class="stack"></div></section>
  <section><h2><span>Question bank</span><button id="refill" class="ghost">Find new questions</button></h2>
    <div class="card">
      <form class="add" id="add"><input name="title" placeholder="Add your own question, e.g. Why do we take our shoes off indoors?" aria-label="Your question"><button class="ghost">Add</button></form>
      <div id="bank"></div>
    </div>
  </section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const post = async (url, body) => {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || 'Request failed')
  return j
}
const flash = (msg, bad) => { const f = $('#flash'); f.textContent = msg; f.className = bad ? 'err' : ''; f.style.display = msg ? 'block' : 'none' }
const STATUS = { drafting: 'Claude is researching and writing', script_review: 'Script: waiting for you', script_approved: 'Assets', rendering: 'Rendering', video_review: 'Video: ready to check', error: 'Failed', approved: 'Approved', published: 'Published' }
let typing = false
const wordCount = (s) => s.replace(/\[[\d.]+\]/g, '').split(/\s+/).filter(Boolean).length

function reelCard(r, jobs) {
  const beats = r.script?.beats || []
  const busy = jobs[`reel:${r.id}`]?.state === 'running'
  const job = jobs[`reel:${r.id}`]
  const review = r.status === 'script_review'
  const words = beats.reduce((n, b) => n + wordCount(b.say || ''), 0)
  const pieceNames = (b) => (b.pieces || []).map((p) => (typeof p === 'string' ? p : p.clip ? `🎞 ${p.clip}` : p.name)).join(', ')
  const beatRows = beats.map((b, i) => `<div class="beat"><div class="meta">${i + 1} · ${esc(b.layout)}</div>
      ${review ? `<textarea rows="2" data-say="${i}">${esc(b.say)}</textarea>` : `<div>${esc(b.say)}</div>`}
      <div class="extra">${b.headline ? `Headline: ${esc(b.headline.join(' / '))} · ` : ''}${esc(pieceNames(b))}${(b.labels || []).length ? ' · Labels: ' + esc(b.labels.map((l) => l.text).join(', ')) : ''}${b.cite ? ' · ' + esc(b.cite) : ''}</div></div>`).join('')
  const waiting = (r.assets || []).filter((a) => a.status !== 'approved')
  const assets = (r.assets || []).length ? `<div class="assets">${r.assets.map((a) => `<span class="${a.status}" title="${esc(a.error || '')}">${a.kind === 'clip' ? '🎞 ' : ''}${esc(a.name)}: ${a.status}</span>`).join('')}</div>` : ''
  const srcList = Array.isArray(r.script?.sources) ? r.script.sources : []
  const sources = srcList.length ? `<details><summary>Sources Claude used (${srcList.length})</summary><ul>${srcList.map((s) => `<li>${esc(s.claim)}: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></details>` : ''
  const caption = r.caption ? `<details><summary>Instagram caption</summary><p>${esc(r.caption)}</p></details>` : ''
  let actions = ''
  if (review) actions = `<div class="row"><button data-a="approve-script">Approve script</button><button class="ghost" data-a="edit">Save my edits</button><button class="ghost" data-a="reject">Drop this reel</button></div>
      <div class="row" style="flex-wrap:nowrap"><input data-note placeholder="Or tell Claude what to change, e.g. the hook isn't answered by the end"><button class="ghost" data-a="revise">Revise</button></div>`
  else if (r.status === 'script_approved') actions = `<div class="row"><button data-a="render" ${waiting.length || busy ? 'disabled' : ''}>Render video</button>${waiting.length ? `<span class="note">${busy ? 'Generating assets…' : `Approve ${waiting.length} asset(s) in the <a href="/library">library</a> first.`}</span>` : ''}</div>`
  else if (r.status === 'video_review') actions = `<div class="row"><a href="${esc(r.video_url)}" target="_blank" rel="noopener"><button>Open video (${esc(r.duration_s)}s)</button></a><button class="ghost" data-a="render">Render again</button><button class="ghost" data-a="posted">Mark as posted</button><button class="ghost" data-a="reject">Drop this reel</button></div>`
  else if (r.status === 'error') actions = `<div class="row">${beats.length ? '<button class="ghost" data-a="render">Try rendering again</button>' : ''}<button class="ghost" data-a="reject">Drop this reel</button></div>`
  return `<div class="card" data-id="${r.id}"><div class="top"><div class="title">${esc(r.title || 'Untitled')}</div><span class="pill">${esc(STATUS[r.status] || r.status)}${busy && r.status !== 'drafting' ? ' · working' : ''}</span></div>
    ${r.error ? `<p class="note err">${esc(r.error)}</p>` : ''}${job?.state === 'error' && !r.error ? `<p class="note err">${esc(job.message)}</p>` : ''}
    ${beats.length ? `<p class="note">${words} spoken words · palette ${esc(r.script.palette)}</p>${beatRows}` : ''}
    ${assets}${sources}${caption}${actions}</div>`
}
function bankRow(q) {
  const s = (q.sources || [])[0] || {}
  const queued = q.status === 'approved'
  return `<div class="q ${queued ? 'queued' : ''}" data-id="${q.id}"><div class="t">${esc(q.title)}</div>
    <div class="act">${queued ? '<button class="ghost" data-b="unqueue">Unpick</button>' : '<button data-b="queue">Pick</button>'}<button class="ghost" data-b="reject" aria-label="Remove">✕</button></div>
    ${q.angle ? `<div class="a">${esc(q.angle)}</div>` : ''}
    <div class="s">${s.author ? `${esc(s.author)}, ${esc(s.work)} (${esc(s.year)})` : esc(q.notes || '')}${s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">source</a>` : ''}${q.score ? ` · score ${q.score}` : ''}${q.example ? `<br>${esc(q.example)}` : ''}</div></div>`
}
async function load() {
  if (typing) return
  const d = await fetch('/studio.json').then((r) => r.json())
  const live = (d.reels || []).filter((r) => !['rejected', 'published', 'approved'].includes(r.status))
  const safe = (fn, x) => { try { return fn(x) } catch (e) { console.error(e); return `<div class="card"><p class="note err">This entry could not be shown: ${esc(e.message)}</p></div>` } }
  $('#reels').innerHTML = live.map((r) => safe((x) => reelCard(x, d.jobs || {}), r)).join('') || '<p class="note">Nothing in progress. Pick questions below, then "Write the next question".</p>'
  const queued = d.bank.filter((q) => q.status === 'approved'), rest = d.bank.filter((q) => q.status !== 'approved')
  $('#bank').innerHTML = [...queued, ...rest].map((q) => safe(bankRow, q)).join('') || '<p class="note" style="padding-top:12px">The bank is empty. "Find new questions" asks Claude to research about ten.</p>'
  const refilling = d.jobs?.refill?.state === 'running'
  $('#refill').disabled = refilling; $('#refill').textContent = refilling ? 'Researching… (a few minutes)' : 'Find new questions'
  if (d.jobs?.refill?.state === 'error') flash('Finding questions failed: ' + d.jobs.refill.message, true)
  if (!d.configured.claude) flash('The Claude API key is not set on the stack yet (ANTHROPIC_API_KEY), so nothing can be researched or written.', true)
}
document.addEventListener('focusin', (e) => { if (e.target.matches('.card textarea, .card input')) typing = true })
document.addEventListener('focusout', (e) => { if (e.target.matches('.card textarea, .card input')) typing = false })
document.addEventListener('click', async (e) => {
  const a = e.target.closest('button[data-a]'), b = e.target.closest('button[data-b]')
  if (!a && !b) return
  const btn = a || b; btn.disabled = true
  try {
    if (b) await post(`/bank/${b.closest('.q').dataset.id}/${b.dataset.b}`)
    else {
      const c = a.closest('.card'), act = a.dataset.a
      const says = [...c.querySelectorAll('[data-say]')].map((t) => t.value)
      if (act === 'approve-script' && says.length) await post(`/reels/${c.dataset.id}/edit`, { says })
      await post(`/reels/${c.dataset.id}/${act}`, act === 'edit' ? { says } : act === 'revise' ? { note: $('[data-note]', c).value } : {})
      flash({ edit: 'Edits saved.', revise: 'Claude is revising; this takes a minute or two.', 'approve-script': 'Script approved. Any new cut-outs and clips are being generated; approve them in the library.', render: 'Rendering; about 90 seconds.', posted: 'Marked as posted.' }[act] || '')
    }
    typing = false; await load()
  } catch (err) { flash(err.message, true); btn.disabled = false }
})
$('#draft').addEventListener('click', async () => { try { await post('/reels/draft'); flash('Claude is researching and writing; this takes a minute or two.'); load() } catch (e) { flash(e.message, true) } })
$('#refill').addEventListener('click', async () => { try { await post('/bank/refill'); flash('Claude is researching new questions; this takes a few minutes.'); load() } catch (e) { flash(e.message, true) } })
$('#add').addEventListener('submit', async (e) => { e.preventDefault(); try { await post('/bank', Object.fromEntries(new FormData(e.target))); e.target.reset(); load() } catch (err) { flash(err.message, true) } })
const tick = () => load().catch((e) => flash('The page could not load its data: ' + e.message, true))
tick(); setInterval(tick, 5000)
</script></body></html>
